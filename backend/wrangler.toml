name = "aegis-ai"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# Serves the built frontend (frontend/dist copied into ./public by the
# root `npm run deploy` script) alongside the /api/* routes.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# --- Optional persistence layer -------------------------------------------
# Uncomment and fill in real IDs after running:
#   npx wrangler kv namespace create AEGIS_JOBS
#   npx wrangler d1 create aegis-db
#   npx wrangler r2 bucket create aegis-packages
# Without these bindings the app runs fully in-memory / mock mode, which is
# enough for a demo but resets whenever the Worker restarts.

# [[kv_namespaces]]
# binding = "AEGIS_JOBS"
# id = "REPLACE_ME"

# [[d1_databases]]
# binding = "AEGIS_DB"
# database_name = "aegis-db"
# database_id = "REPLACE_ME"

# [[r2_buckets]]
# binding = "AEGIS_PACKAGES"
# bucket_name = "aegis-packages"

[vars]
APP_NAME = "AEGIS AI"
